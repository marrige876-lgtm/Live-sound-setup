name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Capacitor app from index.html
        run: |
          mkdir -p build/www
          cp index.html build/www/index.html
          for f in icon-192.png icon-512.png; do [ -f "$f" ] && cp "$f" build/www/ || true; done
          cd build
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.livesound.console","appName":"Live Sound Console","webDir":"www"}
          EOF
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          npx cap sync android
      - name: Build debug APK
        run: cd build/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSoundConsole-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
